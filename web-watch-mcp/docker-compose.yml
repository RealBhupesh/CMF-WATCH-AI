name: job-crawler

services:
  job-crawler:
    build:
      context: .
    image: job-crawler-mcp:latest
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "8788"
      BROWSER_HEADLESS: "true"
      MCP_TRUST_PROXY: uniquelocal
    volumes:
      - ./data:/app/data
    ports:
      - "127.0.0.1:8788:8788"
    shm_size: "1gb"
    user: "1000:1000"
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8788/healthz').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      job-crawler:
        condition: service_healthy
    environment:
      JOB_CRAWLER_DOMAIN: ${JOB_CRAWLER_DOMAIN:?set JOB_CRAWLER_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
